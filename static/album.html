<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿 | Richard's Photography</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header album-header">
    <a href="index.html" class="back-link">← 返回所有相簿</a>
    <h1 id="album-title">載入中…</h1>
    <p id="album-desc" class="subtitle"></p>
    <div class="search-box">
      <input type="text" id="photo-search" placeholder="搜尋這個相簿的照片標題、說明…">
      <span id="photo-count" class="album-count"></span>
    </div>
    <div class="sort-row">
      <label for="sort-select">排列方式</label>
      <select id="sort-select" class="autoplay-speed">
        <option value="default">預設順序</option>
        <option value="taken-desc">拍攝日期：新 → 舊</option>
        <option value="taken-asc">拍攝日期：舊 → 新</option>
        <option value="upload-desc">上傳日期：新 → 舊</option>
        <option value="upload-asc">上傳日期：舊 → 新</option>
        <option value="title-asc">標題：A → Z</option>
        <option value="title-desc">標題：Z → A</option>
        <option value="random">隨機排列</option>
      </select>
    </div>
    <div class="autoplay-controls">
      <button id="autoplay-btn" class="autoplay-btn">▶ 自動播放</button>
      <button id="autoplay-all-btn" class="autoplay-btn">▶ 播放全部</button>
      <select id="orientation-select" class="autoplay-speed" title="相片方向：橫直不分／只挑橫幅／只挑直幅">
        <option value="any" selected>橫直不分</option>
        <option value="landscape">只挑橫幅</option>
        <option value="portrait">只挑直幅</option>
      </select>
      <select id="autoplay-speed" class="autoplay-speed">
        <option value="1000">1 秒</option>
        <option value="2000">2 秒</option>
        <option value="3000" selected>3 秒</option>
        <option value="5000">5 秒</option>
        <option value="10000">10 秒</option>
      </select>
      <select id="quality-select" class="autoplay-speed">
        <option value="low">省流量畫質</option>
        <option value="medium" selected>標準畫質</option>
        <option value="high">高畫質</option>
      </select>
      <select id="caption-select" class="autoplay-speed" title="放大檢視時是否顯示說明、所在相簿與標籤">
        <option value="show" selected>顯示說明</option>
        <option value="hide">不顯示說明</option>
      </select>
      <button id="fullscreen-btn" class="autoplay-btn">⛶ 全螢幕</button>
      <button id="contact-btn" class="contact-btn">✉ 聯絡我</button>
    </div>
  </header>

  <main class="full-width">
    <div id="photos-grid" class="photos-grid">
      <p class="loading">載入照片中…</p>
    </div>
  </main>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" id="lightbox-close">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev">‹</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-desc" class="lightbox-desc"></p>
      <div id="lightbox-albums" class="lightbox-albums"></div>
      <div id="lightbox-tags" class="lightbox-tags"></div>
      <div class="lightbox-like-wrap">
        <button id="lightbox-like-btn" class="like-btn" title="按讚">♡</button>
        <span id="like-count" class="like-count">0</span>
      </div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next">›</button>
    <button class="lightbox-autoplay" id="lightbox-autoplay-btn">▶</button>
  </div>

  <div id="contact-modal" class="contact-modal">
    <div class="contact-modal-content">
      <button class="contact-close" id="contact-close">✕</button>
      <h2>聯絡我</h2>
      <form id="contact-form" class="contact-form">
        <label>您的 Email
          <input type="email" name="email" required placeholder="your@email.com">
        </label>
        <label>訊息內容
          <textarea name="message" rows="5" required placeholder="想說的話…"></textarea>
        </label>
        <button type="submit" class="contact-submit">送出</button>
      </form>
      <p id="contact-status" class="contact-status"></p>
    </div>
  </div>

  <script src="js/album.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
