<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richard's Photography</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="title-row">
      <h1>Richard's Photography</h1>
      <img class="visit-badge" src="https://hits.sh/wang-vz6p.onrender.com.svg?style=flat-square&label=Visitors&color=555555" alt="訪客數">
      <span id="album-count" class="album-count"></span>
    </div>
    <div class="controls-row">
      <input type="text" id="search" placeholder="搜尋相簿名稱、說明、照片標籤…" title="多條件用空格分開">
      <select id="sort-select" class="autoplay-speed" title="排列方式">
        <option value="default">排列：預設順序</option>
        <option value="title-asc">相簿名稱（A→Z）</option>
        <option value="title-desc">相簿名稱（Z→A）</option>
        <option value="photos-desc">相片張數（多→少）</option>
        <option value="photos-asc">相片張數（少→多）</option>
        <option value="update-desc">最近更新（新→舊）</option>
        <option value="update-asc">最近更新（舊→新）</option>
        <option value="create-desc">建立日期（新→舊）</option>
        <option value="create-asc">建立日期（舊→新）</option>
      </select>
      <button id="build-index-btn" class="index-btn">建立／更新標籤索引</button>
      <button id="contact-btn" class="contact-btn">✉ 聯絡我</button>
      <span id="index-status" class="index-status"></span>
    </div>
  </header>

  <main class="full-width">
    <div id="albums-grid" class="albums-grid">
      <p class="loading">載入相簿中…</p>
    </div>
  </main>

  <div id="contact-modal" class="contact-modal">
    <div class="contact-modal-content">
      <button class="contact-close" id="contact-close">✕</button>
      <h2>聯絡我</h2>
      <form id="contact-form" class="contact-form">
        <label>您的 Email
          <input type="email" name="email" required placeholder="your@email.com">
        </label>
        <label>訊息內容
          <textarea name="message" rows="5" required placeholder="想說的話…"></textarea>
        </label>
        <button type="submit" class="contact-submit">送出</button>
      </form>
      <p id="contact-status" class="contact-status"></p>
    </div>
  </div>

  <script src="js/albums.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
